<!DOCTYPE html>
<html>
<head>
    <title>Web System</title>
    <script src="{{ url_for('static', filename='js/joy.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/socket.io.min.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/system.css') }}">
</head>
<body>

<div class="container">
    <!-- Bal oldali videó panel -->
    <div class="video-container">
        <img src="/video/mjpeg" alt="MJPEG Video" />
    </div>

    <!-- Jobb oldali vezérlő panel -->
    <div class="control-panel">
        <!-- Joystickok felül kerettel és felirattal -->
        <div class="joysticks-wrapper">
            <div class="joystick-box">
                <span class="joystick-label">Move</span>
                <div id="joy1Div" class="joy-pad"></div>
            </div>
            <div class="joystick-box">
                <span class="joystick-label">Attitude</span>
                <div id="joy2Div" class="joy-pad"></div>
            </div>
        </div>

        <!-- Gombok csoportosítva, sorokba rendezve -->
        <div class="buttons-wrapper">
            <!-- Rendszer gombok (sötétpiros) -->
            <div class="button-group">
                <button id="button_on" class="circle-button button-neutral">On</button>
                <button id="button_off" class="circle-button button-neutral">Off</button>
                <button id="button_reset" class="circle-button button-neutral">Reset</button>
                <button id="button_reload" class="circle-button button-neutral">Reload</button>
            </div>

            <!-- Akció gombok (piros) -->
            <div class="button-group">
                <button id="button_pee" class="circle-button button-action">Pee</button>
                <button id="button_wave" class="circle-button button-action">Wave</button>
                <button id="button_look" class="circle-button button-action">Look</button>
                <button id="button_sit" class="circle-button button-action">Sit</button>
            </div>

            <!-- Figyelmeztető / Egyéb gombok (narancs) -->
            <div class="button-group">
                <button id="button_joke" class="circle-button button-warn">Joke</button>
                <button id="button_what" class="circle-button button-warn">What</button>
            </div>
        </div>

        <!-- Dinamikus kártyák -->
        <div id="cards-container" class="cards-wrapper">
            <section class="status-card">
                <h3>Ollama Models (ps)</h3>
                <div id="status-ollama" class="status-scroll">Loading...</div>
            </section>

            <section class="status-card">
                <h3>Robot Ping</h3>
                <div id="status-ping" class="status-line">Loading...</div>
                <canvas id="ping-chart" width="420" height="150"></canvas>
            </section>

            <section class="status-card chart-bg-card">
                <canvas id="cloud-stream-chart" class="bg-chart"></canvas>
                <div class="card-content">
                    <h3>Cloud Stream</h3>
                    <div id="status-cloud-stream" class="status-scroll">Loading...</div>
                </div>
            </section>

            <section class="status-card chart-bg-card">
                <canvas id="robot-stream-chart" class="bg-chart"></canvas>
                <div class="card-content">
                    <h3>Robot Stream</h3>
                    <div id="status-robot-stream" class="status-scroll">Loading...</div>
                </div>
            </section>
        </div>
    </div>
</div>

<script>
    var socket = io({
        path: '/apps/system/socket.io/'
    });
    socket.on('connect', function() {
        socket.emit('my event', {data: 'I\'m connected!'});
    });

    var Joy1 = new JoyStick('joy1Div', {}, function(stickData) {
        socket.emit('joy1', stickData.cardinalDirection);
    });
    var Joy2 = new JoyStick('joy2Div', {}, function(stickData) {
        socket.emit('joy2', stickData.cardinalDirection);
    });

    document.querySelector('#button_reset').addEventListener('click', function() {
        socket.emit('action', 'reset');
    });
    document.querySelector('#button_reload').addEventListener('click', function() {
        socket.emit('action', 'reload');
    });
    document.querySelector('#button_pee').addEventListener('click', function() {
        socket.emit('action', 'pee');
    });
    document.querySelector('#button_wave').addEventListener('click', function() {
        socket.emit('action', 'wave');
    });
    document.querySelector('#button_look').addEventListener('click', function() {
        socket.emit('action', 'look');
    });
    document.querySelector('#button_sit').addEventListener('click', function() {
        socket.emit('action', 'sit');
    });
    document.querySelector('#button_joke').addEventListener('click', function() {
        socket.emit('action', 'joke');
    });
    document.querySelector('#button_on').addEventListener('click', function() {
        socket.emit('action', 'on');
    });
    document.querySelector('#button_off').addEventListener('click', function() {
        socket.emit('action', 'off');
    });
    document.querySelector('#button_what').addEventListener('click', function() {
        fetch('/video/jpeg')
            .then(response => response.blob())
            .then(blob => {
                const reader = new FileReader();
                reader.onloadend = function() {
                    const dataURL = reader.result;
                    socket.emit('image', dataURL);
                    setTimeout(function() {
                        socket.emit('action', 'what');
                    }, 500);
                };
                reader.readAsDataURL(blob);
            });
    });

    var pingHistory = [];
    var cloudBitrateHistory = [];
    var robotBitrateHistory = [];
    var historyMax = 60;

    var statusOllama = document.getElementById('status-ollama');
    var statusPing = document.getElementById('status-ping');
    var cloud_statusStream = document.getElementById('status-cloud-stream');
    var robot_statusStream = document.getElementById('status-robot-stream');
    var pingChart = document.getElementById('ping-chart');
    var pingCtx = pingChart ? pingChart.getContext('2d') : null;

    function escapeHtml(value) {
        return String(value || '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function formatBitrate(bytesPerSec) {
        var bps = (Number(bytesPerSec) || 0) * 8;
        var kbps = bps / 1000;
        var mbps = bps / 1000000;

        if (mbps >= 1.0) {
            return mbps.toFixed(2) + ' Mbps (' + Math.round(kbps) + ' kbps)';
        } else if (kbps >= 1.0) {
            return kbps.toFixed(1) + ' kbps (' + Math.round(bps) + ' bps)';
        }
        return Math.round(bps) + ' bps';
    }

    function drawPingChart() {
        if (!pingCtx || !pingChart) return;

        var width = pingChart.width;
        var height = pingChart.height;
        pingCtx.clearRect(0, 0, width, height);

        pingCtx.fillStyle = '#0d1117';
        pingCtx.fillRect(0, 0, width, height);

        pingCtx.strokeStyle = 'rgba(255,255,255,0.15)';
        pingCtx.lineWidth = 1;
        pingCtx.beginPath();
        pingCtx.moveTo(36, 8);
        pingCtx.lineTo(36, height - 24);
        pingCtx.lineTo(width - 8, height - 24);
        pingCtx.stroke();

        var values = pingHistory.filter(function(item) { return item !== null; });
        if (!values.length) {
            pingCtx.fillStyle = '#9ca3af';
            pingCtx.font = '12px sans-serif';
            pingCtx.fillText('No ping samples yet', 46, 26);
            return;
        }

        var maxValue = Math.max(10, Math.ceil(Math.max.apply(null, values) * 1.25));
        var minValue = 0;
        var chartLeft = 36;
        var chartTop = 8;
        var chartWidth = width - chartLeft - 8;
        var chartHeight = height - chartTop - 32;

        pingCtx.strokeStyle = 'rgba(255,255,255,0.12)';
        pingCtx.fillStyle = '#9ca3af';
        pingCtx.font = '10px sans-serif';
        for (var i = 0; i <= 4; i++) {
            var y = chartTop + (chartHeight * i / 4);
            pingCtx.beginPath();
            pingCtx.moveTo(chartLeft, y);
            pingCtx.lineTo(chartLeft + chartWidth, y);
            pingCtx.stroke();
            var tickValue = Math.round(maxValue - ((maxValue - minValue) * i / 4));
            pingCtx.fillText(String(tickValue), 4, y + 3);
        }

        var points = [];
        var denom = Math.max(1, pingHistory.length - 1);
        pingHistory.forEach(function(value, index) {
            if (value === null) return;
            var x = chartLeft + (chartWidth * index / denom);
            var yRatio = (value - minValue) / Math.max(1, (maxValue - minValue));
            var y = chartTop + chartHeight - (yRatio * chartHeight);
            points.push({ x: x, y: y, value: value });
        });

        if (!points.length) return;

        pingCtx.strokeStyle = '#34d399';
        pingCtx.lineWidth = 2;
        pingCtx.beginPath();
        pingCtx.moveTo(points[0].x, points[0].y);
        for (var p = 1; p < points.length; p++) {
            pingCtx.lineTo(points[p].x, points[p].y);
        }
        pingCtx.stroke();

        var lastPoint = points[points.length - 1];
        pingCtx.fillStyle = '#34d399';
        pingCtx.beginPath();
        pingCtx.arc(lastPoint.x, lastPoint.y, 3, 0, Math.PI * 2);
        pingCtx.fill();
    }

    function drawBitrateBackgroundChart(canvasId, historyData, colorHex) {
        var canvas = document.getElementById(canvasId);
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        if (!ctx) return;

        var rect = canvas.getBoundingClientRect();
        if (canvas.width !== rect.width || canvas.height !== rect.height) {
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        var width = canvas.width;
        var height = canvas.height;
        ctx.clearRect(0, 0, width, height);

        var values = historyData.filter(function(v) { return v !== null; });
        if (!values.length) return;

        var maxMbps = Math.max(0.5, Math.max.apply(null, values) * 1.2);
        var minMbps = 0;
        var chartLeft = 40;
        var chartRight = width - 10;
        var chartTop = 10;
        var chartBottom = height - 20;
        var chartWidth = chartRight - chartLeft;
        var chartHeight = chartBottom - chartTop;

        // Grid lines & Axis labels
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.font = '10px monospace';
        ctx.lineWidth = 1;

        for (var i = 0; i <= 2; i++) {
            var y = chartTop + (chartHeight * i / 2);
            ctx.beginPath();
            ctx.moveTo(chartLeft, y);
            ctx.lineTo(chartRight, y);
            ctx.stroke();
            var valMbps = (maxMbps - ((maxMbps - minMbps) * i / 2));
            ctx.fillText(valMbps.toFixed(1) + 'M', 6, y + 3);
        }

        var points = [];
        var denom = Math.max(1, historyData.length - 1);
        historyData.forEach(function(val, idx) {
            if (val === null) return;
            var x = chartLeft + (chartWidth * idx / denom);
            var ratio = (val - minMbps) / Math.max(0.001, (maxMbps - minMbps));
            var y = chartBottom - (ratio * chartHeight);
            points.push({ x: x, y: y });
        });

        if (points.length < 2) return;

        // Area Fill
        ctx.fillStyle = colorHex + '22'; // low opacity fill
        ctx.beginPath();
        ctx.moveTo(points[0].x, chartBottom);
        points.forEach(function(pt) { ctx.lineTo(pt.x, pt.y); });
        ctx.lineTo(points[points.length - 1].x, chartBottom);
        ctx.closePath();
        ctx.fill();

        // Line
        ctx.strokeStyle = colorHex;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (var p = 1; p < points.length; p++) {
            ctx.lineTo(points[p].x, points[p].y);
        }
        ctx.stroke();
    }

    function renderOllamaStatus(ollamaPayload) {
        if (!statusOllama) return;

        var servers = Array.isArray(ollamaPayload && ollamaPayload.servers) ? ollamaPayload.servers : [];
        if (!servers.length) {
            statusOllama.innerHTML = '<div class="mono-line">No active Ollama server workers.</div>';
            return;
        }

        var html = [];
        servers.forEach(function(server) {
            html.push('<div class="status-block">');
            html.push('<div class="mono-line"><strong>Server:</strong> ' + escapeHtml(server.server_url || 'unknown') + '</div>');

            var psModels = Array.isArray(server.ps_models) ? server.ps_models : [];
            if (!psModels.length) {
                html.push('<div class="mono-line">No loaded models reported by ps.</div>');
            } else {
                psModels.forEach(function(modelEntry) {
                    var modelName = escapeHtml(modelEntry.model || 'unknown');
                    var gpu = Number(modelEntry.gpu_utilization || 0).toFixed(2);
                    var ctx = escapeHtml(modelEntry.context_length || 0);
                    var sizeBytes = Number(modelEntry.model_size_bytes || 0);
                    var vramBytes = Number(modelEntry.gpu_vram_bytes || 0);
                    var sizeGb = (sizeBytes / (1024 * 1024 * 1024)).toFixed(2);
                    var vramGb = (vramBytes / (1024 * 1024 * 1024)).toFixed(2);
                    var quant = escapeHtml(modelEntry.quantization_level || '-');
                    var family = escapeHtml(modelEntry.family || '-');
                    html.push(
                        '<div class="mono-line">• ' + modelName
                        + ' | size: ' + sizeGb + ' GB'
                        + ' | vram: ' + vramGb + ' GB'
                        + ' | GPU: ' + gpu + '%'
                        + ' | ctx: ' + ctx
                        + ' | q: ' + quant
                        + ' | family: ' + family
                        + '</div>'
                    );
                });
            }
            html.push('</div>');
        });

        statusOllama.innerHTML = html.join('');
    }

    function renderPingStatus(pingPayload) {
        if (!statusPing) return;

        var robotIp = pingPayload && pingPayload.robot_ip ? String(pingPayload.robot_ip) : 'n/a';
        var ok = !!(pingPayload && pingPayload.status === 'rst');
        var sequence = pingPayload && pingPayload.sequence !== undefined ? String(pingPayload.sequence) : '-';
        var timestampIso = pingPayload && pingPayload.timestamp_iso ? String(pingPayload.timestamp_iso) : '-';
        var rtt = pingPayload && pingPayload.rtt_ms !== null && pingPayload.rtt_ms !== undefined
            ? Number(pingPayload.rtt_ms)
            : null;

        if (rtt !== null && isFinite(rtt) && rtt >= 0) {
            pingHistory.push(rtt);
        } else {
            pingHistory.push(null);
        }
        while (pingHistory.length > historyMax) {
            pingHistory.shift();
        }

        var line = 'IP: ' + robotIp + ':56789 | seq=' + sequence + ' | ';
        if (rtt !== null && isFinite(rtt) && rtt >= 0) {
            line += 'RTT: ' + rtt.toFixed(2) + ' ms';
        } else {
            line += 'RTT: -1';
            if (pingPayload && pingPayload.error) {
                line += ' (' + String(pingPayload.error) + ')';
            }
        }

        line += ' | ' + timestampIso;

        statusPing.textContent = line;
        statusPing.className = ok ? 'status-line good' : 'status-line bad';
        drawPingChart();
    }

    function cloud_renderStreamStatus(streamPayload) {
        if (!cloud_statusStream) return;

        if (!streamPayload || !streamPayload.ok) {
            var err = streamPayload && streamPayload.error ? String(streamPayload.error) : 'cloud stream stats unavailable';
            cloud_statusStream.innerHTML = '<div class="mono-line">' + escapeHtml(err) + '</div>';
            cloudBitrateHistory.push(null);
        } else {
            var resolution = streamPayload.resolution || {};
            var fps = Number(streamPayload.fps || 0).toFixed(2);
            var bytesPerSec = streamPayload.bytes_per_sec !== undefined ? streamPayload.bytes_per_sec : ((streamPayload.bitrate_bps || 0) / 8);
            var formattedBitrate = formatBitrate(bytesPerSec);
            var label = resolution.label || 'unknown';

            var mbps = (bytesPerSec * 8) / 1000000;
            cloudBitrateHistory.push(mbps);

            cloud_statusStream.innerHTML = [
                '<div class="mono-line"><strong>Resolution:</strong> ' + escapeHtml(label) + '</div>',
                '<div class="mono-line"><strong>FPS:</strong> ' + fps + '</div>',
                '<div class="mono-line"><strong>Bitrate:</strong> ' + formattedBitrate + '</div>'
            ].join('');
        }

        while (cloudBitrateHistory.length > historyMax) cloudBitrateHistory.shift();
        drawBitrateBackgroundChart('cloud-stream-chart', cloudBitrateHistory, '#38bdf8');
    }

    function robot_renderStreamStatus(streamPayload) {
        if (!robot_statusStream) return;

        if (!streamPayload || !streamPayload.ok) {
            var err = streamPayload && streamPayload.error ? String(streamPayload.error) : 'robot stream stats unavailable';
            robot_statusStream.innerHTML = '<div class="mono-line">' + escapeHtml(err) + '</div>';
            robotBitrateHistory.push(null);
        } else {
            var fps = Number(streamPayload.fps || 0).toFixed(2);
            var bytesPerSec = streamPayload.bytes_per_sec !== undefined ? streamPayload.bytes_per_sec : 0;
            var formattedBitrate = formatBitrate(bytesPerSec);
            var seqNumber = streamPayload.frames !== undefined ? escapeHtml(streamPayload.frames) : '-';
            var totalBytes = streamPayload.bytes !== undefined ? (Number(streamPayload.bytes) / (1024 * 1024)).toFixed(2) + ' MB' : '-';

            var mbps = (bytesPerSec * 8) / 1000000;
            robotBitrateHistory.push(mbps);

            robot_statusStream.innerHTML = [
                '<div class="mono-line"><strong>FPS:</strong> ' + fps + '</div>',
                '<div class="mono-line"><strong>Bitrate:</strong> ' + formattedBitrate + '</div>',
                '<div class="mono-line"><strong>Sequence (Frames):</strong> ' + seqNumber + '</div>',
                '<div class="mono-line"><strong>Total Transferred:</strong> ' + totalBytes + '</div>'
            ].join('');
        }

        while (robotBitrateHistory.length > historyMax) robotBitrateHistory.shift();
        drawBitrateBackgroundChart('robot-stream-chart', robotBitrateHistory, '#a855f7');
    }

    function updateSystemStatus() {
        var ollamaUrl = 'http://{{ host }}:5059/api/status/ollama?include_ps=1';
        var pingUrl = 'http://{{ host }}:5059/api/status/ping';
        var cloud_streamUrl = 'http://{{ host }}:5059/video/stats';
        var robot_streamUrl = 'http://{{ host }}:5059/api/status/robotvideo';

        function fetchJsonOrThrow(url) {
            return fetch(url).then(function(response) {
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status + ' for ' + url);
                }
                return response.json();
            });
        }

        Promise.allSettled([
            fetchJsonOrThrow(ollamaUrl),
            fetchJsonOrThrow(pingUrl),
            fetchJsonOrThrow(cloud_streamUrl),
            fetchJsonOrThrow(robot_streamUrl)
        ])
        .then(function(results) {
            var ollamaResult = results[0];
            var pingResult = results[1];
            var cloud_streamResult = results[2];
            var robot_streamResult = results[3];

            if (ollamaResult.status === 'fulfilled') {
                renderOllamaStatus(ollamaResult.value);
            } else if (statusOllama) {
                statusOllama.textContent = 'ollama fetch failed: ' + String(ollamaResult.reason || 'unknown error');
            }

            if (pingResult.status === 'fulfilled') {
                renderPingStatus(pingResult.value);
            } else if (statusPing) {
                statusPing.textContent = 'ping fetch failed: ' + String(pingResult.reason || 'unknown error');
            }

            if (cloud_streamResult.status === 'fulfilled') {
                var cloud_streamPayload = cloud_streamResult.value;
                cloud_streamPayload.ok = true;
                cloud_renderStreamStatus(cloud_streamPayload);
            } else if (cloud_statusStream) {
                cloud_statusStream.textContent = 'cloud stream fetch failed: ' + String(cloud_streamResult.reason || 'unknown error');
            }

            if (robot_streamResult.status === 'fulfilled') {
                var robot_streamPayload = robot_streamResult.value;
                robot_streamPayload.ok = true;
                robot_renderStreamStatus(robot_streamPayload);
            } else if (robot_statusStream) {
                robot_statusStream.textContent = 'robot stream fetch failed: ' + String(robot_streamResult.reason || 'unknown error');
            }
        });
    }

    updateSystemStatus();
    setInterval(updateSystemStatus, 1000);
</script>

</body>
</html>
