<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pupality Selector</title>
    <script src="{{ url_for('static', filename='js/socket.io.min.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pupality.css') }}">
</head>
<body>

<div class="container">
    <header class="header">
        <div class="header-text">
            <h1>Pupality Deck</h1>
            <p>Select the active personality profile for your robot dog.</p>
        </div>
        <button id="btn-refresh" class="refresh-button" title="Reload pupalities from config">
            &#x21bb;
        </button>
    </header>

    <main id="pupality-grid" class="pupality-grid" aria-live="polite" aria-label="Pupality cards"></main>

    <div id="empty-state" class="empty-state">
        Waiting for pupalities event...
    </div>
</div>

<div id="info-overlay" class="info-overlay" hidden>
    <div class="info-window" role="dialog" aria-modal="true" aria-labelledby="info-title">
        <div class="info-window-header">
            <h2 id="info-title">Pupality Info</h2>
            <div class="info-header-controls">
                <div class="text-size-controls" role="group" aria-label="Text size controls">
                    <button id="font-normal" class="text-size-button is-active" type="button" title="Normal text size" aria-label="Normal text size">A</button>
                    <button id="font-large" class="text-size-button" type="button" title="Large text size" aria-label="Large text size">A+</button>
                    <button id="font-xlarge" class="text-size-button" type="button" title="Extra large text size" aria-label="Extra large text size">A++</button>
                </div>
                <button id="info-back" class="info-back" type="button" aria-label="Go back" hidden>Back</button>
                <button id="info-close" class="info-close" aria-label="Close info">Close</button>
            </div>
        </div>
        <div id="info-content" class="info-content size-normal">
            <div id="info-content-main"></div>
            <div id="info-content-detail" hidden></div>
        </div>
    </div>
</div>

<script>
    var socket = io({
        path: '/apps/pupality/socket.io/'
    });

    var pupalities = [];
    var selectedPupalityName = '';
    var activeInfoName = '';
    var infoOverlay = null;
    var infoContent = null;
    var infoMainContent = null;
    var infoDetailContent = null;
    var infoBackButton = null;
    var activeInfoPayload = null;

    function normalizePupalities(payload) {
        if (Array.isArray(payload)) return payload;
        if (payload && Array.isArray(payload.data)) return payload.data;
        return [];
    }

    function safeImageSource(value) {
        if (typeof value !== 'string') return '';
        var trimmed = value.trim();
        if (!trimmed || !trimmed.startsWith('data:image/')) return '';
        
        return trimmed;
    }

    function createMetaItem(label, value) {
        var row = document.createElement('div');
        row.className = 'meta-row';

        var key = document.createElement('span');
        key.className = 'meta-key';
        key.textContent = label;

        var content = document.createElement('span');
        content.className = 'meta-value';
        content.textContent = value || '-';

        row.appendChild(key);
        row.appendChild(content);
        return row;
    }

    function escapeHtml(value) {
        return String(value || '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function setInfoTextSize(sizeName) {
        if (!infoContent) return;
        infoContent.classList.remove('size-normal', 'size-large', 'size-xlarge');

        var normalized = sizeName;
        if (normalized !== 'size-large' && normalized !== 'size-xlarge') {
            normalized = 'size-normal';
        }
        infoContent.classList.add(normalized);

        ['font-normal', 'font-large', 'font-xlarge'].forEach(function(id) {
            var button = document.getElementById(id);
            if (!button) return;
            button.classList.remove('is-active');
        });

        var activeButtonId = 'font-normal';
        if (normalized === 'size-large') activeButtonId = 'font-large';
        if (normalized === 'size-xlarge') activeButtonId = 'font-xlarge';

        var activeButton = document.getElementById(activeButtonId);
        if (activeButton) {
            activeButton.classList.add('is-active');
        }
    }

    function showInfoMainPage() {
        if (!infoMainContent || !infoDetailContent || !infoBackButton) return;
        infoMainContent.hidden = false;
        infoDetailContent.hidden = true;
        infoBackButton.hidden = true;
    }

    function showInfoDetailPage(title, summary, details, bodyText) {
        if (!infoMainContent || !infoDetailContent || !infoBackButton) return;

        infoDetailContent.innerHTML = '';

        var section = document.createElement('section');
        section.className = 'info-section';

        var heading = document.createElement('h3');
        heading.textContent = title || 'Details';
        section.appendChild(heading);

        if (summary) {
            var summaryEl = document.createElement('p');
            summaryEl.className = 'detail-summary';
            summaryEl.textContent = summary;
            section.appendChild(summaryEl);
        }

        if (Array.isArray(details) && details.length) {
            var meta = document.createElement('ul');
            meta.className = 'info-list';
            details.forEach(function(item) {
                if (!item || !item.label) return;
                var li = document.createElement('li');
                if (item.href) {
                    var link = document.createElement('a');
                    link.className = 'info-link';
                    link.href = item.href;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.textContent = item.label + ': ' + (item.value || item.href);
                    li.appendChild(link);
                } else {
                    li.textContent = item.label + ': ' + (item.value || '-');
                }
                meta.appendChild(li);
            });
            section.appendChild(meta);
        }

        if (bodyText) {
            var body = document.createElement('pre');
            body.className = 'soul-text detail-body';
            body.textContent = bodyText;
            section.appendChild(body);
        }

        infoDetailContent.appendChild(section);
        infoMainContent.hidden = true;
        infoDetailContent.hidden = false;
        infoBackButton.hidden = false;
    }

    function buildToolLookup(tools) {
        var map = {};

        if (!Array.isArray(tools)) return map;

        tools.forEach(function(tool) {
            if (!tool || tool.available === false) return;
            var keys = [];
            if (tool.ref) keys.push(String(tool.ref));
            if (tool.name) keys.push(String(tool.name));
            if (Array.isArray(tool.tags)) {
                tool.tags.forEach(function(tag) {
                    if (tag) keys.push(String(tag));
                });
            }
            if (Array.isArray(tool.provided_mcp_tools)) {
                tool.provided_mcp_tools.forEach(function(capability) {
                    if (capability) keys.push(String(capability));
                    var slashParts = String(capability || '').split('/');
                    if (slashParts.length > 1 && slashParts[1]) {
                        keys.push(slashParts[1]);
                    }
                });
            }

            keys.forEach(function(key) {
                map[key] = tool;
            });
        });

        return map;
    }

    function buildCard(item) {
        var card = document.createElement('article');
        card.className = 'pupality-card';
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');

        var itemId = item && item.id ? String(item.id) : '';
        var itemName = item && item.name ? String(item.name) : itemId;
        if (itemId && itemId === selectedPupalityName) {
            card.classList.add('is-selected');
        }

        var imageWrap = document.createElement('div');
        imageWrap.className = 'card-image-wrap';

        var image = document.createElement('img');
        image.className = 'card-image';
        image.alt = (item && item.name ? String(item.name) : 'Dog') + ' personality image';

        var imageSrc = safeImageSource(item && item.image);
        if (imageSrc) {
            image.src = imageSrc;
        } else {
            image.classList.add('placeholder-image');
        }

        imageWrap.appendChild(image);

        var body = document.createElement('div');
        body.className = 'card-body';

        var titleRow = document.createElement('div');
        titleRow.className = 'title-row';

        var title = document.createElement('h2');
        title.className = 'card-title';
        title.textContent = item && item.name ? String(item.name) : 'Unnamed Pupality';

        var lang = document.createElement('span');
        lang.className = 'lang-chip';
        lang.textContent = (item && item.language ? String(item.language) : '--').toUpperCase();

        titleRow.appendChild(title);
        titleRow.appendChild(lang);

        body.appendChild(titleRow);
        body.appendChild(createMetaItem('LLM', item && item.llm_model ? String(item.llm_model) : '-'));
        body.appendChild(createMetaItem('TTS', item && item.tts ? String(item.tts) : '-'));

        var infoButton = document.createElement('button');
        infoButton.className = 'info-button';
        infoButton.type = 'button';
        infoButton.textContent = 'Info';

        card.appendChild(imageWrap);
        card.appendChild(body);
        card.appendChild(infoButton);

        function emitSelection() {
            selectedPupalityName = itemId;
            renderPupalities(pupalities);

            var selected = {
                name: itemId,
            };
            socket.emit('pupality_select', selected);
        }

        card.addEventListener('click', emitSelection);
        card.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                emitSelection();
            }
        });

        infoButton.addEventListener('click', function(event) {
            event.preventDefault();
            event.stopPropagation();

            if (activeInfoName === itemId && infoOverlay && !infoOverlay.hidden) {
                hideInfo();
                return;
            }

            activeInfoName = itemId;
            socket.emit('pupality_info', { name: itemId });
        });

        return card;
    }

    function hideInfo() {
        if (!infoOverlay || !infoContent || !infoMainContent || !infoDetailContent) return;
        infoOverlay.hidden = true;
        infoMainContent.innerHTML = '';
        infoDetailContent.innerHTML = '';
        showInfoMainPage();
        activeInfoName = '';
        activeInfoPayload = null;
    }

    function renderToolsSection(tools) {
        var section = document.createElement('section');
        section.className = 'info-section';

        var title = document.createElement('h3');
        title.textContent = 'Tools';
        section.appendChild(title);

        var list = document.createElement('ul');
        list.className = 'info-list';

        if (!Array.isArray(tools) || !tools.length) {
            var empty = document.createElement('li');
            empty.textContent = 'No tools configured.';
            list.appendChild(empty);
        } else {
            tools.forEach(function(tool) {
                var li = document.createElement('li');
                var name = tool && tool.name ? String(tool.name) : String(tool.ref || 'unknown');
                var type = tool && tool.type ? String(tool.type) : '-';
                var url = tool && tool.url ? String(tool.url) : '-';

                if (tool && tool.available === false) {
                    li.textContent = name + ' [missing descriptor]';
                    li.className = 'skill-unavailable';
                    list.appendChild(li);
                    return;
                }

                var link = document.createElement('a');
                link.href = '#';
                link.className = 'info-link';
                link.textContent = name + ' [' + type + '] ' + url;
                link.addEventListener('click', function(event) {
                    event.preventDefault();

                    var details = [
                        { label: 'Type', value: type },
                        { label: 'Endpoint', value: url },
                    ];

                    if (tool && tool.file) {
                        details.push({ label: 'Descriptor file', value: String(tool.file) });
                    }

                    if (tool && tool.source_file) {
                        details.push({ label: 'Source file', value: String(tool.source_file) });
                    }

                    if (tool && tool.url && String(tool.url).startsWith('http')) {
                        details.push({ label: 'Open endpoint', value: String(tool.url), href: String(tool.url) });
                    }

                    var summary = tool && tool.description ? String(tool.description) : 'No description available.';
                    var body = '';
                    if (Array.isArray(tool && tool.provided_mcp_tools) && tool.provided_mcp_tools.length) {
                        body = 'Provided MCP tools:\n' + tool.provided_mcp_tools.join('\n');
                    }

                    showInfoDetailPage(name, summary, details, body);
                });

                li.appendChild(link);
                list.appendChild(li);
            });
        }

        section.appendChild(list);
        return section;
    }

    function renderSkillsSection(availableSkills, unavailableSkills, toolsLookup) {
        var section = document.createElement('section');
        section.className = 'info-section';

        var title = document.createElement('h3');
        title.textContent = 'Skills';
        section.appendChild(title);

        var list = document.createElement('ul');
        list.className = 'info-list';

        function appendSkill(skill, unavailable) {
            var li = document.createElement('li');
            if (unavailable) li.className = 'skill-unavailable';

            var skillName = skill && skill.name ? String(skill.name) : String((skill && skill.id) || 'unknown-skill');
            var summary = skill && skill.description ? String(skill.description) : 'No description available.';
            var details = [];
            if (skill && skill.id) details.push({ label: 'ID', value: String(skill.id) });
            if (skill && skill.doc_url) details.push({ label: 'Doc URL', value: String(skill.doc_url), href: String(skill.doc_url) });

            var skillLink = document.createElement('a');
            skillLink.href = '#';
            skillLink.className = 'info-link';
            skillLink.textContent = skillName;
            skillLink.addEventListener('click', function(event) {
                event.preventDefault();
                showInfoDetailPage(skillName, summary, details, skill && skill.content ? String(skill.content) : '');
            });
            li.appendChild(skillLink);

            var required = Array.isArray(skill && skill.required_mcp_tools) ? skill.required_mcp_tools : [];
            var missing = Array.isArray(skill && skill.missing_required_mcp_tools) ? skill.missing_required_mcp_tools : [];

            if (required.length) {
                li.appendChild(document.createTextNode(' ('));
                required.forEach(function(dep, index) {
                    var depText = String(dep);
                    var depTool = toolsLookup[depText] || toolsLookup[depText.split('/')[1] || depText];

                    if (depTool) {
                        var depLink = document.createElement('a');
                        depLink.href = '#';
                        depLink.className = 'info-link dep-link';
                        depLink.textContent = depText;
                        depLink.addEventListener('click', function(event) {
                            event.preventDefault();
                            var depName = depTool.name ? String(depTool.name) : String(depTool.ref || depText);
                            var depSummary = depTool.description ? String(depTool.description) : 'No description available.';
                            var depDetails = [
                                { label: 'Type', value: depTool.type ? String(depTool.type) : '-' },
                                { label: 'Endpoint', value: depTool.url ? String(depTool.url) : '-' },
                            ];
                            showInfoDetailPage(depName, depSummary, depDetails, '');
                        });
                        li.appendChild(depLink);
                    } else {
                        var depSpan = document.createElement('span');
                        depSpan.textContent = depText;
                        if (missing.indexOf(depText) >= 0) {
                            depSpan.className = 'skill-missing-dep';
                        }
                        li.appendChild(depSpan);
                    }

                    if (index < required.length - 1) {
                        li.appendChild(document.createTextNode(', '));
                    }
                });
                li.appendChild(document.createTextNode(')'));
            }

            list.appendChild(li);
        }

        if (Array.isArray(availableSkills) && availableSkills.length) {
            availableSkills.forEach(function(skill) {
                appendSkill(skill, false);
            });
        }

        if (Array.isArray(unavailableSkills) && unavailableSkills.length) {
            unavailableSkills.forEach(function(skill) {
                appendSkill(skill, true);
            });
        }

        if (!list.childNodes.length) {
            var empty = document.createElement('li');
            empty.textContent = 'No skills configured.';
            list.appendChild(empty);
        }

        section.appendChild(list);
        return section;
    }

    function renderInfo(payload) {
        if (!infoOverlay || !infoMainContent) return;

        activeInfoPayload = payload || {};

        infoMainContent.innerHTML = '';

        var toolsLookup = buildToolLookup(payload && payload.tools);

        var topSection = document.createElement('section');
        topSection.className = 'info-section info-top';

        var img = document.createElement('img');
        img.className = 'info-image';
        img.alt = (payload && payload.name ? String(payload.name) : 'Pupality') + ' image';
        var src = safeImageSource(payload && payload.image);
        if (src) {
            img.src = src;
        }

        var soulWrap = document.createElement('div');
        soulWrap.className = 'soul-wrap';

        var soulTitle = document.createElement('h3');
        soulTitle.textContent = 'SOUL' + (payload && payload.soul_file ? ' [' + payload.soul_file + ']' : '');
        soulWrap.appendChild(soulTitle);

        var soulText = document.createElement('pre');
        soulText.className = 'soul-text';
        soulText.textContent = payload && payload.soul ? String(payload.soul) : 'No SOUL file found.';
        soulWrap.appendChild(soulText);

        topSection.appendChild(img);
        topSection.appendChild(soulWrap);
        infoMainContent.appendChild(topSection);

        infoMainContent.appendChild(renderToolsSection(payload && payload.tools));
        infoMainContent.appendChild(
            renderSkillsSection(
                payload && payload.skills_available,
                payload && payload.skills_unavailable,
                toolsLookup
            )
        );

        showInfoMainPage();
        infoOverlay.hidden = false;
    }

    function renderPupalities(list) {
        var grid = document.getElementById('pupality-grid');
        var emptyState = document.getElementById('empty-state');
        if (!grid || !emptyState) return;

        while (grid.firstChild) grid.removeChild(grid.firstChild);

        if (!list.length) {
            emptyState.style.display = 'block';
            grid.style.display = 'none';
            return;
        }

        emptyState.style.display = 'none';
        grid.style.display = 'grid';
        list.forEach(function(item) {
            grid.appendChild(buildCard(item));
        });
    }

    document.getElementById('btn-refresh').addEventListener('click', function() {
        socket.emit('refresh_pupalities');
    });

    socket.on('connect', function() {
        console.log('Connected to pupality socket');
    });

    socket.on('pupalities', function(payload) {
        if (payload && typeof payload.selected === 'string') {
            selectedPupalityName = payload.selected;
        }
        pupalities = normalizePupalities(payload);
        renderPupalities(pupalities);
    });

    socket.on('pupality_info', function(payload) {
        if (!payload || !payload.name) return;
        if (payload.name !== activeInfoName) return;
        renderInfo(payload);
    });

    infoOverlay = document.getElementById('info-overlay');
    infoContent = document.getElementById('info-content');
    infoMainContent = document.getElementById('info-content-main');
    infoDetailContent = document.getElementById('info-content-detail');
    infoBackButton = document.getElementById('info-back');

    document.getElementById('font-normal').addEventListener('click', function() {
        setInfoTextSize('size-normal');
    });
    document.getElementById('font-large').addEventListener('click', function() {
        setInfoTextSize('size-large');
    });
    document.getElementById('font-xlarge').addEventListener('click', function() {
        setInfoTextSize('size-xlarge');
    });
    infoBackButton.addEventListener('click', showInfoMainPage);

    document.getElementById('info-close').addEventListener('click', hideInfo);
    infoOverlay.addEventListener('click', function(event) {
        if (event.target === infoOverlay) {
            hideInfo();
        }
    });

    renderPupalities([]);

</script>

</body>
</html>
