<!DOCTYPE html>
<html>
<head>
    <title>Web Kovesd</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-container img {
            /* Megadjuk a teljes méretet a konténerhez képest */
            width: 100%;
            height: 100%;
            
            /* Az object-fit SKÁLÁZZA fel/le a képet a kereten belül, megtartva a képarányt */
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>

<div class="video-container">
    <img src="/video/mjpeg_kovesd" alt="MJPEG Video Stream" />
</div>

</body>
</html>
