[pupcard]
language = "HUN"
model = "Qwen3.5:2b + Qwen3-VL:2b"
tts = "Meta HUN"

[general]
cache = "~/.cache/jelveny"
log = "~/log/jelveny"

[language]
ui = "hu"
prompt = "hu"

[models]
general = "qwen3.5:2b"
translation = ""
vision = "qwen3-vl-4k:2b"

[llm]
type = "ollama"
url = "http://10.6.6.20:11434/v1"
key = "not-needed"
model = "qwen3.5:2b"

[openai]
api_base = "http://10.6.6.20:11434/v1"
api_key = "not-needed"
keep_alive = "30m"
enable_thinking = false
thinking_budget = 1024
max_output_tokens = 1536
translation_max_output_tokens = 2048
prompt_temperature = 0.9
prompt_frequency_penalty = 0.8
binary_iollama = true
mages = false

[tts]
protocol = "mms"
model = "facebook/mms-tts-hun"

[ports]
voice = 5059
control = 5002

[streamer]
url = "http://10.100.0.38:8000"
stream_ip = "10.100.0.20"
stream_port = 5100

[tools]
list = ["body", "visionprompt"]

[tools.meta]
visionprompt = "{\"model\": \"qwen3-vl-4k:2b\"}"