[pupcard]
language = "ENG"
model = "Qwen3.5:4b + Qwen3-VL:4b"
tts = "Meta ENG"

[general]
cache = "~/.cache/lassie"
log = "~/log/lassie"

[language]
ui = "en"
prompt = "en"

[models]
general = "qwen3.5:4b"
translation = ""
vision = "qwen3-vl:4b"

[openai]
api_base = "http://10.6.6.20:11434/v1"
api_key = "not-needed"
keep_alive = "30m"
enable_thinking = true
thinking_budget = 1024
max_output_tokens = 1536
translation_max_output_tokens = 2048
prompt_temperature = 0.9
prompt_frequency_penalty = 0.8
binary_images = false
ollama = true

[tts]
# Facebook english
protocol = "mms"
model = "facebook/mms-tts-eng"
#voice = "larynx:cmu_eey"

[ports]
voice = 5059
control = 5002

[streamer]
url = "http://10.100.0.38:8000"
stream_ip = "10.100.0.20"
stream_port = 5100

[tools]
list = ["highfive", "dice", "body", "visionprompt"]

[skills]
list = ["cautious_navigation", "object_search", "visual_vlm_analysis"]
