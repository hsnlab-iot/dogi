<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function bypassPinggy() {
      if (!sessionStorage.getItem('pinggy_bypassed')) {
        fetch(window.location.href, {
          method: 'GET',
          headers: { 'X-Pinggy-No-Screen': 'true' },
          credentials: 'include',
          cache: 'no-store'
        })
        .then(() => {
          sessionStorage.setItem('pinggy_bypassed', 'true');
          window.location.reload();
        })
        .catch(err => console.error('Pinggy bypass error:', err));
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
  <meta name="theme-color" content="#0f172a">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dogi Controller">
  
  <link rel="stylesheet" href="/style.css">
  <title>Dogi Controller</title>
</head>
<body>

  <div id="app-container">

    <!-- MAIN PAGE -->
    <div id="page-main" class="page active">
      <header>
        <h1>Dogi controller</h1>
        <div class="header-actions">
          <button class="icon-btn" onclick="showPage('page-log')" title="System Log">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
          </button>
          <button class="icon-btn" onclick="toggleModal('modal-settings', true)" title="Settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        </div>
      </header>

      <div class="content">
        <!-- BLE Connection Panel -->
        <div class="card">
          <div class="btn-group">
            <button class="action-btn" id="scanBtn" onclick="scanBLE()">Scan</button>
            <button class="action-btn secondary" id="connectBtn" onclick="connectBLE()">Connect</button>
          </div>
          <select id="deviceSelect">
            <option value="">No devices found</option>
          </select>
        </div>

        <!-- Video Control Section -->
        <div class="video-control-card">
          <div class="card-title">Video Stream Quality</div>
          <div class="slider-container">
            <input type="range" id="videoSlider" class="cmd-control" min="0" max="4" step="1" value="0" onchange="onVideoQualityChange(this.value)" disabled>
            <div class="slider-labels">
              <span>OFF</span>
              <span>256K</span>
              <span>512K</span>
              <span>1024K</span>
              <span>2048K</span>
            </div>
          </div>
        </div>

        <!-- WiFi Interface -->
        <div class="card">
          <div class="card-title">WiFi Interface</div>
          <div class="btn-group">
            <button class="action-btn secondary cmd-control" onclick="sendCommand('WSTA')" disabled>WiFi STA</button>
            <button class="action-btn secondary cmd-control" onclick="sendCommand('WAP')" disabled>WiFi AP</button>
          </div>
        </div>

        <!-- Connection Route -->
        <div class="card">
          <div class="card-title">Connection Route</div>
          <div class="btn-group">
            <button class="action-btn secondary cmd-control" onclick="sendCommand('USEWIFI')" disabled>Use WiFi</button>
            <button class="action-btn secondary cmd-control" onclick="sendCommand('USE5G')" disabled>Use 5G</button>
          </div>
        </div>

        <!-- System Controls -->
        <div class="card">
          <div class="card-title">System</div>
          <div class="btn-group">
            <button class="action-btn secondary cmd-control" onclick="sendCommand('RESTART')" disabled>Restart dogi</button>
            <button class="action-btn danger cmd-control" onclick="sendCommand('SHUTDOWN')" disabled>Shutdown</button>
          </div>
        </div>

        <!-- Telemetry Data -->
        <div class="card">
          <div class="telemetry-grid">
            <div class="field">
              <label>wlan0 address:</label>
              <input type="text" id="wlan0" readonly placeholder="---">
            </div>
            <div class="field">
              <label>wwan0 address:</label>
              <input type="text" id="wwan0" readonly placeholder="---">
            </div>
            <div class="field">
              <label>Route:</label>
              <input type="text" id="route" readonly placeholder="---">
            </div>
            <div class="field">
              <label>WiFi mode:</label>
              <input type="text" id="wifimode" readonly placeholder="---">
            </div>
            <div class="field" style="grid-column: span 2;">
              <label>Onboard Docker Status:</label>
              <input type="text" id="onboardStatus" readonly placeholder="---">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- FULL PAGE: SYSTEM LOG -->
    <div id="page-log" class="page">
      <header>
        <button class="icon-btn" onclick="showPage('page-main')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <h1>System Log</h1>
        <div class="header-actions">
          <label class="switch" title="Font Size Toggle">
            <input type="checkbox" id="fontToggle" onchange="toggleLogFontSize(this.checked)">
            <span class="slider"></span>
          </label>
        </div>
      </header>

      <div class="content">
        <div id="logOutput" class="log-container font-small"></div>
        <button class="action-btn secondary" onclick="clearLogs()">Clear Log</button>
      </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="modal-settings" class="modal-overlay">
      <div class="modal-content">
        <div class="card-title" style="margin-bottom: 8px;">Settings</div>
        
        <div class="field" style="margin-bottom: 15px;">
          <label for="pskInput">Security PIN / Shared Secret:</label>
          <input type="password" id="pskInput" value="721135" placeholder="Enter PIN/Password">
        </div>

        <div class="switch-label">
          <span>Demo / Simulation Mode</span>
          <label class="switch">
            <input type="checkbox" id="demoToggle" onchange="toggleDemoMode(this.checked)">
            <span class="slider"></span>
          </label>
        </div>

        <button class="action-btn" onclick="saveSettings()" style="margin-top: 10px;">Save & Close</button>
      </div>
    </div>

  </div>

  <script>
    const SERVICE_UUID = "b4e1d091-8571-4b5e-8564-000000000000";
    const CMD_UUID     = "b4e1d091-8571-4b5e-8564-000000000001";
    const STATUS_UUID  = "b4e1d091-8571-4b5e-8564-000000000002";

    const VIDEO_COMMANDS = ['VID_OFF', 'VID_256K', 'VID_512K', 'VID_1024K', 'VID_2048K'];

    let bleDevice = null;
    let gattServer = null;
    let cmdCharacteristic = null;
    let statusCharacteristic = null;

    let clientKeyPair = null;
    let aesSessionKey = null;

    let isDemoMode = false;
    let demoInterval = null;
    let isConnected = false;

    // SCREEN WAKE LOCK VARIABLE
    let wakeLock = null;

    window.addEventListener('DOMContentLoaded', () => {
      const savedPsk = localStorage.getItem('dogi_psk') || '721135';
      document.getElementById('pskInput').value = savedPsk;
      updateUIState(false);
      
      // Képernyő ébren tartása betöltéskor
      requestWakeLock();
    });

    // WAKE LOCK LOGIKA: Képernyő aktívan tartása
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          log('Screen Wake Lock is active (screen will stay awake).');

          wakeLock.addEventListener('release', () => {
            log('Screen Wake Lock was released.');
          });
        } catch (err) {
          log(`Wake Lock error: ${err.name}, ${err.message}`);
        }
      } else {
        log('Screen Wake Lock API is not supported on this browser.');
      }
    }

    // Újraaktiválás, ha a böngésző lap/alkalmazás újra fókuszba kerül
    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    function saveSettings() {
      const psk = document.getElementById('pskInput').value.trim();
      localStorage.setItem('dogi_psk', psk);
      log("Security PIN / PSK updated.");
      toggleModal('modal-settings', false);
    }

    function log(msg) {
      const output = document.getElementById('logOutput');
      const timestamp = new Date().toLocaleTimeString();
      if (output) {
        output.innerText += `[${timestamp}] ${msg}\n`;
        output.scrollTop = output.scrollHeight;
      }
      console.log(msg);
    }

    function clearLogs() {
      document.getElementById('logOutput').innerText = '';
    }

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }

    function toggleModal(modalId, show) {
      const modal = document.getElementById(modalId);
      if (show) modal.classList.add('active');
      else modal.classList.remove('active');
    }

    function toggleLogFontSize(isBig) {
      const logContainer = document.getElementById('logOutput');
      if (isBig) {
        logContainer.classList.remove('font-small');
        logContainer.classList.add('font-large');
      } else {
        logContainer.classList.remove('font-large');
        logContainer.classList.add('font-small');
      }
    }

    function updateUIState(connected) {
      isConnected = connected;
      const connectBtn = document.getElementById('connectBtn');
      const controls = document.querySelectorAll('.cmd-control');

      if (connected) {
        connectBtn.innerText = "Connected";
        connectBtn.style.backgroundColor = "#10b981";
        controls.forEach(ctrl => ctrl.removeAttribute('disabled'));
      } else {
        connectBtn.innerText = "Connect";
        connectBtn.style.backgroundColor = "";
        controls.forEach(ctrl => ctrl.setAttribute('disabled', 'true'));
        document.getElementById('wlan0').value = '---';
        document.getElementById('wwan0').value = '---';
        document.getElementById('route').value = '---';
        document.getElementById('wifimode').value = '---';
        document.getElementById('onboardStatus').value = '---';
      }
    }

    function toggleDemoMode(enabled) {
      isDemoMode = enabled;
      log(`Demo mode ${enabled ? 'enabled' : 'disabled'}`);
      if (enabled) {
        updateUIState(true);
        startDemoTelemetry();
      } else {
        updateUIState(false);
        if (demoInterval) clearInterval(demoInterval);
      }
    }

    async function deriveNoisePSKKey(serverPubKeyB64, pskPassphrase) {
      const serverKeyBytes = Uint8Array.from(atob(serverPubKeyB64), c => c.charCodeAt(0));
      const serverPublicKey = await window.crypto.subtle.importKey(
        "raw", serverKeyBytes, { name: "X25519" }, false, []
      );

      const dhBits = await window.crypto.subtle.deriveBits(
        { name: "X25519", public: serverPublicKey },
        clientKeyPair.privateKey,
        256
      );

      const pskEncoder = new TextEncoder();
      const hkdfKey = await window.crypto.subtle.importKey(
        "raw", dhBits, { name: "HKDF" }, false, ["deriveKey"]
      );

      aesSessionKey = await window.crypto.subtle.deriveKey(
        {
          name: "HKDF",
          hash: "SHA-256",
          salt: pskEncoder.encode(pskPassphrase),
          info: pskEncoder.encode("noise-psk-ble-v1")
        },
        hkdfKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );

      log("Noise-PSK Encrypted channel established!");
    }

    async function scanBLE() {
      if (isDemoMode) {
        log("Demo Mode: Simulated scan performed.");
        const select = document.getElementById('deviceSelect');
        select.innerHTML = '<option value="demo-device">Dogi Robot (Demo)</option>';
        return;
      }

      try {
        log("Scanning for Bluetooth devices...");
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ services: [SERVICE_UUID] }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        const select = document.getElementById('deviceSelect');
        select.innerHTML = `<option value="${bleDevice.id}">${bleDevice.name || 'Dogi Robot'}</option>`;
        log(`Found device: ${bleDevice.name || bleDevice.id}`);
      } catch (err) {
        log(`Scan failed: ${err.message}`);
      }
    }

    async function connectBLE() {
      if (isDemoMode) {
        log("Demo Mode: Connected to simulated Dogi.");
        updateUIState(true);
        return;
      }

      if (!bleDevice) {
        log("No device selected. Please scan first.");
        return;
      }

      try {
        log("Connecting to GATT Server...");
        gattServer = await bleDevice.gatt.connect();
        const service = await gattServer.getPrimaryService(SERVICE_UUID);

        cmdCharacteristic = await service.getCharacteristic(CMD_UUID);
        statusCharacteristic = await service.getCharacteristic(STATUS_UUID);

        await statusCharacteristic.startNotifications();
        statusCharacteristic.removeEventListener('characteristicvaluechanged', handleStatusUpdate);
        statusCharacteristic.addEventListener('characteristicvaluechanged', handleStatusUpdate);

        log("Generating Ephemeral Keypair...");
        clientKeyPair = await window.crypto.subtle.generateKey({ name: "X25519" }, true, ["deriveBits"]);
        const rawPub = await window.crypto.subtle.exportKey("raw", clientKeyPair.publicKey);
        const pubB64 = btoa(String.fromCharCode(...new Uint8Array(rawPub)));

        log("Initiating Handshake...");
        await cmdCharacteristic.writeValue(new TextEncoder().encode(`KEYEX:${pubB64}`));

      } catch (err) {
        log(`Connection failed: ${err.message}`);
        updateUIState(false);
      }
    }

    function onDisconnected() {
      log("BLE connection lost! Attempting auto-reconnect...");
      aesSessionKey = null;
      updateUIState(false);

      if (!isDemoMode && bleDevice) {
        setTimeout(async () => {
          try {
            log("Auto-reconnecting to Dogi...");
            await connectBLE();
          } catch (err) {
            log("Auto-reconnect failed. Tap Connect manually.");
          }
        }, 2000);
      }
    }

    async function sendCommand(cmd) {
      log(`Sending command: ${cmd}`);
      if (isDemoMode) {
        log(`Demo Mode: Command "${cmd}" processed.`);
        return;
      }

      if (!cmdCharacteristic) {
        log("Error: Not connected to BLE device.");
        return;
      }

      try {
        let payloadStr = cmd;
        if (aesSessionKey) {
          const iv = window.crypto.getRandomValues(new Uint8Array(12));
          const ciphertext = await window.crypto.subtle.encrypt(
            { name: "AES-GCM", iv: iv },
            aesSessionKey,
            new TextEncoder().encode(cmd)
          );

          payloadStr = "ENC:" + JSON.stringify({
            nonce: btoa(String.fromCharCode(...iv)),
            ct: btoa(String.fromCharCode(...new Uint8Array(ciphertext)))
          });
        }

        await cmdCharacteristic.writeValue(new TextEncoder().encode(payloadStr));
      } catch (err) {
        log(`Failed to send command: ${err.message}`);
      }
    }

    function onVideoQualityChange(val) {
      const cmd = VIDEO_COMMANDS[val];
      sendCommand(cmd);
    }

    async function handleStatusUpdate(event) {
      let rawString = new TextDecoder('utf-8').decode(event.target.value);
      if (!rawString) return;

      rawString = rawString.trim().replace(/\x00/g, '');

      if (rawString.startsWith("KEYEX_RESP:")) {
        const serverPubB64 = rawString.split("KEYEX_RESP:")[1];
        const psk = localStorage.getItem('dogi_psk') || '721135';
        await deriveNoisePSKKey(serverPubB64, psk);
        await sendCommand('CONNECT');
        return;
      }

      if (rawString.startsWith("ENC:")) {
        try {
          const data = JSON.parse(rawString.substring(4));
          const iv = Uint8Array.from(atob(data.nonce), c => c.charCodeAt(0));
          const ct = Uint8Array.from(atob(data.ct), c => c.charCodeAt(0));

          const decrypted = await window.crypto.subtle.decrypt(
            { name: "AES-GCM", iv: iv },
            aesSessionKey,
            ct
          );
          rawString = new TextDecoder('utf-8').decode(decrypted).trim();
        } catch (e) {
          log("Decryption failed! Check PIN/PSK setting.");
          return;
        }
      }

      log(`[STATUS IN] ${rawString}`);

      if (rawString === "WELCOME" || rawString === "PONG") {
        updateUIState(true);
        log("Connected & Authenticated!");
        return;
      }

      // Rugalmas mezőillesztés Pipe (|) és/vagy At (@) elválasztásra
      const tokens = rawString.split(/[@|]/);

      tokens.forEach(token => {
        const item = token.trim();
        const upper = item.toUpperCase();

        if (upper.includes('WLAN0') || upper.includes('WLAN') || (upper.includes('IP:') && !upper.includes('WWAN'))) {
          const val = item.includes(':') ? item.split(':')[1] : item;
          document.getElementById('wlan0').value = val.trim();
        } 
        else if (upper.includes('WWAN0') || upper.includes('WWAN')) {
          const val = item.includes(':') ? item.split(':')[1] : item;
          document.getElementById('wwan0').value = val.trim();
        } 
        else if (upper.startsWith('MODE:')) {
          document.getElementById('wifimode').value = item.split(':')[1].trim();
        } 
        else if (upper.startsWith('ROUTE:')) {
          document.getElementById('route').value = item.split(':')[1].trim();
        }
        else if (upper.startsWith('ONBOARD:')) {
          const val = item.substring(8).trim();
          document.getElementById('onboardStatus').value = val;
        }
      });
    }

    function startDemoTelemetry() {
      if (demoInterval) clearInterval(demoInterval);
      demoInterval = setInterval(() => {
        if (!isDemoMode) return;
        const simulatedData = "wlan0:192.168.1.248 | wwan0:10.20.5.38 | MODE:STA | ROUTE:WIFI | ONBOARD:Up 15 minutes";
        handleStatusUpdate({
          target: { value: new TextEncoder().encode(simulatedData) }
        });
      }, 5000);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => log('Service Worker registered successfully.'))
          .catch((err) => log(`Service Worker failed: ${err}`));
      });
    }
  </script>
</body>
</html>
